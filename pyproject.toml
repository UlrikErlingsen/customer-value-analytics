[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-value-analytics"
version = "1.3.0"
description = "Worth Signal: an open, local-first customer value toolkit for marketers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ulrik Erlingsen" }]
keywords = ["customer analytics", "customer lifetime value", "marketing analytics", "rfm", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
ui = [
  "plotly>=5.18,<8",
  "streamlit>=1.38,<2",
]
test = [
  "plotly>=5.18,<8",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "streamlit>=1.38,<2",
]

[project.urls]
Homepage = "https://github.com/UlrikErlingsen/customer-value-analytics"
Documentation = "https://github.com/UlrikErlingsen/customer-value-analytics/blob/main/docs/data_guide.md"
Issues = "https://github.com/UlrikErlingsen/customer-value-analytics/issues"
Changelog = "https://github.com/UlrikErlingsen/customer-value-analytics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cva.ui" = ["assets/marks/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
